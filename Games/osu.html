<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Circle Rhythm</title>
<style>
:root{--Bg:#f3effa;--Panel:#fff;--Ink:#241b3d;--Soft:#ddd3f2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--Bg:#140f23;--Panel:#231c3c;--Ink:#fff;--Soft:#3a2f5e}}
:root[data-theme="dark"]{--Bg:#140f23;--Panel:#231c3c;--Ink:#fff;--Soft:#3a2f5e}
html,body{height:100%;margin:0;background:var(--Bg);color:var(--Ink);font:700 18px system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#Hud{position:fixed;left:16px;top:calc(12px + env(safe-area-inset-top,0px));pointer-events:none;white-space:pre;line-height:1.4}
#Bar{width:240px;height:12px;background:var(--Soft);margin-bottom:8px;border-radius:6px;overflow:hidden}
#Fill{height:100%;width:100%;background:#5adc78}
.Panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,92vw);background:var(--Panel);padding:20px;box-sizing:border-box;text-align:center;border-radius:14px;box-shadow:0 8px 40px #0006}
.Panel[hidden]{display:none}
button{font:inherit;color:#fff;border:0;border-radius:10px;padding:16px;cursor:pointer;background:#e0408a}
.Grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.Row{display:flex;gap:10px;align-items:center;margin:12px 0}
.Row span{flex:1}
.Wide{width:100%;background:#5a5a82}
</style>
</head>
<body>
<canvas id="Game"></canvas>
<div id="Hud"><div id="Bar"><div id="Fill"></div></div><div id="Info"></div></div>
<div class="Panel" id="Menu">
<div id="Title">Circle Rhythm<br>Choose a difficulty</div>
<div class="Row"><button id="Prev">◀</button><span id="LevelText"></span><button id="Next">▶</button></div>
<div class="Grid" id="Modes"></div>
<button class="Wide" id="Open">Settings</button>
</div>
<div class="Panel" id="Settings" hidden>
<div>Settings</div>
<div class="Row"><button data-K="Size" data-D="-5">−</button><span id="SizeText"></span><button data-K="Size" data-D="5">+</button></div>
<div class="Row"><button data-K="Margin" data-D="-5">−</button><span id="MarginText"></span><button data-K="Margin" data-D="5">+</button></div>
<div class="Row"><button data-K="Rate" data-D="-0.25">−</button><span id="RateText"></span><button data-K="Rate" data-D="0.25">+</button></div>
<button class="Wide" id="Back">Back</button>
</div>
<script>
let Get = Id => document.getElementById(Id)
let Clamp = (V, A, B) => Math.min(Math.max(V, A), B)

// Stats
let Score = 0, Combo = 0, MaxCombo = 0, Health = 100, Earned = 0, Possible = 0
let Playing = false, Now = 0

// Difficulty
let Mode, Approach, Size, Gap, Count, SliderChance, SlideTime, Window, Drain, Regen
let SizeOffset = 0, Margin = 10, Rate = 1
let Modes = {
	Easy: [1.4, 100, 0.9, 30, 0.2, 1.4, 1.4, 5, 4],
	Medium: [1.1, 85, 0.75, 40, 0.25, 1.2, 1.15, 8, 3],
	Hard: [0.85, 70, 0.55, 50, 0.3, 1, 1, 10, 3],
	"Very Hard": [0.6, 58, 0.42, 70, 0.35, 0.8, 0.8, 14, 2]
}

// Levels
let Level = null, LevelIndex = 0
let Levels = [
	{Name: "Random"},
	{Name: "Spiral", Bpm: 140, Count: 48, Entry: N => ({X: 0.5 + 0.32 * Math.cos(N * 0.55), Y: 0.55 + 0.28 * Math.sin(N * 0.55), Beats: 1, Slider: N % 9 == 0})},
	{Name: "Zigzag", Bpm: 150, Count: 48, Entry: N => ({X: N % 2 ? 0.2 : 0.8, Y: 0.2 + 0.65 * Math.abs(N % 14 / 7 - 1), Beats: 1, Slider: N % 10 == 0})},
	{Name: "Square Dance", Bpm: 128, Count: 50, Entry: N => ({X: [0.2, 0.8, 0.8, 0.2, 0.5][N % 5], Y: [0.25, 0.25, 0.8, 0.8, 0.52][N % 5], Beats: N % 5 == 4 ? 2 : 1, Slider: N % 15 == 14})},
	{Name: "Heartbeat", Bpm: 100, Count: 45, Entry: N => ({X: 0.2 + 0.6 * ((N * 0.37) % 1), Y: 0.3 + 0.45 * Math.abs(Math.sin(N * 1.3)), Beats: N % 3 == 0 ? 2 : 0.5, Slider: N % 12 == 0})}
]

// Objects
let Objects = [], Popups = [], Spawned = 0, NextSpawn = 0

// Input
let PX = 0, PY = 0, Held = false

let Canvas = Get("Game"), Ctx = Canvas.getContext("2d")

function Resize() {
	let Dpr = devicePixelRatio || 1
	Canvas.width = innerWidth * Dpr
	Canvas.height = innerHeight * Dpr
	Ctx.setTransform(Dpr, 0, 0, Dpr, 0, 0)
}

function UpdateInfo() {
	Get("Info").textContent = `Mode: ${Mode || "-"}${Level ? " - " + Level.Name : ""}\nScore: ${Score}\nCombo: ${Combo}x\nAccuracy: ${(Possible ? Earned / Possible * 100 : 100).toFixed(2)}%`
	Get("Fill").style.width = Health + "%"
}

function UpdateSettings() {
	Get("SizeText").textContent = "Object Size: " + (SizeOffset >= 0 ? "+" : "") + SizeOffset
	Get("MarginText").textContent = "Size Margin: ±" + Margin
	Get("RateText").textContent = "Spawn Rate: " + Rate.toFixed(2) + "x"
}

function End(Title) {
	Playing = false
	Objects = []
	Get("Title").innerHTML = `${Mode} - ${Title}<br>Score: ${Score} | Max Combo: ${MaxCombo}x<br>Choose a difficulty`
	Get("Menu").hidden = false
}

function Result(Value, X, Y) {
	if (!Playing) return
	if (Value == 0) {
		Combo = 0
		Health -= Drain
		Possible += 300
		Popups.push({Text: "Miss", Color: "#ff4646", X, Y, T: Now})
		UpdateInfo()
		if (Health <= 0) End("Game Over")
		return
	}
	Combo++
	MaxCombo = Math.max(MaxCombo, Combo)
	Score += Value + Math.floor(Value * Combo / 25)
	Earned += Value
	Possible += 300
	Health = Math.min(100, Health + Regen)
	Popups.push({Text: Value, Color: Value == 300 ? "#64c8ff" : Value == 100 ? "#78ff78" : "#ffdc64", X, Y, T: Now})
	UpdateInfo()
}

function Judge(Difference) {
	return Difference < 0.08 * Window ? 300 : Difference < 0.16 * Window ? 100 : Difference < 0.3 * Window ? 50 : 0
}

function Remove(O) {
	Objects = Objects.filter(P => P !== O)
	if (O.Slider) NextSpawn = Now + Gap / Rate
}

function Spawn() {
	Spawned++
	let W = innerWidth, H = innerHeight, E = Level && Level.Entry(Spawned)
	let O = {N: Spawned, D: Math.max(30, Size + Math.round(Math.random() * 2 * Margin - Margin)), X: W * (E ? E.X : 0.1 + Math.random() * 0.8), Y: H * (E ? E.Y : 0.2 + Math.random() * 0.65), T: Now + Approach}
	if (E ? E.Slider : Spawned > 3 && Math.random() < SliderChance) {
		let A = Math.atan2(H / 2 - O.Y, W / 2 - O.X) + (Math.random() * 120 - 60) * Math.PI / 180
		let L = 200 + Math.random() * 120
		O.Slider = true
		O.X2 = Clamp(O.X + Math.cos(A) * L, 60, W - 60)
		O.Y2 = Clamp(O.Y + Math.sin(A) * L, 100, H - 60)
		if (E) {
			O.X2 = O.X + W * (O.X < W / 2 ? 0.22 : -0.22)
			O.Y2 = Clamp(O.Y + H * (O.Y < H / 2 ? 0.12 : -0.12), 100, H - 60)
		}
	}
	Objects.push(O)
}

// Objects are stored oldest first, so the oldest one gets the click
function Press(X, Y) {
	for (let O of Objects) {
		if (O.Sliding || Math.hypot(X - O.X, Y - O.Y) > O.D / 2) continue
		let Value = Judge(Math.abs(Now - O.T))
		if (!O.Slider || Value == 0) {
			Remove(O)
			Result(Value, O.X, O.Y)
		} else {
			O.Sliding = true
			O.Start = Now
			O.Value = Value
			O.Frames = 0
			O.Tracked = 0
			O.BX = O.X
			O.BY = O.Y
		}
		return
	}
}

function Update() {
	if (!Playing) return
	for (let O of [...Objects]) {
		if (O.Sliding) {
			let A = Math.min((Now - O.Start) / SlideTime, 1)
			O.BX = O.X + (O.X2 - O.X) * A
			O.BY = O.Y + (O.Y2 - O.Y) * A
			O.Frames++
			if (Held && Math.hypot(PX - O.BX, PY - O.BY) < O.D * 0.8) O.Tracked++
			if (A >= 1) {
				let R = O.Tracked / O.Frames
				Remove(O)
				Result(R > 0.9 ? O.Value : R > 0.5 ? Math.min(O.Value, 100) : R > 0.2 ? 50 : 0, O.X2, O.Y2)
			}
		} else if (Now > O.T + 0.3 * Window) {
			Remove(O)
			Result(0, O.X, O.Y)
		}
		if (!Playing) return
	}
	// Sliders block the next object until they are finished
	if (Spawned < Count && Now >= NextSpawn && !Objects.some(O => O.Slider)) {
		Spawn()
		NextSpawn = Now + (Level ? Level.Entry(Spawned).Beats * 60 / Level.Bpm * Gap / 0.55 : Math.max(Gap * 0.6, Gap - Spawned * 0.008)) / Rate
	} else if (Spawned >= Count && !Objects.length) {
		End("Cleared!")
	}
}

function Draw() {
	Ctx.clearRect(0, 0, innerWidth, innerHeight)
	Ctx.textAlign = "center"
	Ctx.textBaseline = "middle"
	Ctx.lineCap = "round"

	// Newest drawn first so the oldest sits on top
	for (let I = Objects.length - 1; I >= 0; I--) {
		let O = Objects[I], Color = `hsl(${O.N * 25 % 360} 70% 65%)`
		if (O.Slider) {
			Ctx.beginPath()
			Ctx.moveTo(O.X, O.Y)
			Ctx.lineTo(O.X2, O.Y2)
			Ctx.strokeStyle = "#fff"
			Ctx.lineWidth = O.D + 6
			Ctx.stroke()
			Ctx.strokeStyle = Color
			Ctx.globalAlpha = 0.6
			Ctx.lineWidth = O.D
			Ctx.stroke()
			Ctx.globalAlpha = 1
			Ctx.beginPath()
			Ctx.arc(O.X2, O.Y2, O.D * 0.3, 0, 7)
			Ctx.strokeStyle = "#fff"
			Ctx.lineWidth = 4
			Ctx.stroke()
		}
		if (O.Sliding) {
			Ctx.beginPath()
			Ctx.arc(O.BX, O.BY, O.D * 0.8, 0, 7)
			Ctx.fillStyle = "#ffffff55"
			Ctx.fill()
			Ctx.strokeStyle = "#ffdc64"
			Ctx.lineWidth = 4
			Ctx.stroke()
			continue
		}
		Ctx.beginPath()
		Ctx.arc(O.X, O.Y, O.D / 2, 0, 7)
		Ctx.fillStyle = Color
		Ctx.fill()
		Ctx.fillStyle = "#fff"
		Ctx.font = "bold 28px system-ui"
		Ctx.fillText((O.N - 1) % 5 + 1, O.X, O.Y)
		Ctx.beginPath()
		Ctx.arc(O.X, O.Y, O.D / 2 * (1 + 2 * Math.max(0, (O.T - Now) / Approach)), 0, 7)
		Ctx.strokeStyle = "#fff"
		Ctx.lineWidth = 3
		Ctx.stroke()
	}

	Popups = Popups.filter(P => Now - P.T < 0.5)
	for (let P of Popups) {
		let Age = (Now - P.T) / 0.5
		Ctx.globalAlpha = 1 - Age
		Ctx.fillStyle = P.Color
		Ctx.font = "900 28px system-ui"
		Ctx.fillText(P.Text, P.X, P.Y - 40 * Age)
	}
	Ctx.globalAlpha = 1
}

function Frame() {
	Now = performance.now() / 1000
	Update()
	Draw()
	requestAnimationFrame(Frame)
}

function Start(Name) {
	Mode = Name
	;[Approach, Size, Gap, Count, SliderChance, SlideTime, Window, Drain, Regen] = Modes[Name]
	Size = Math.max(30, Size + SizeOffset)
	Count = Level ? Level.Count : Count
	Objects = []
	Popups = []
	Spawned = 0
	NextSpawn = Now + 0.5
	Score = Combo = MaxCombo = Earned = Possible = 0
	Health = 100
	Playing = true
	Get("Menu").hidden = true
	UpdateInfo()
}

Object.keys(Modes).forEach((Name, Index) => {
	let Button = document.createElement("button")
	Button.textContent = Name
	Button.style.background = `hsl(${120 - Index * 40} 60% 42%)`
	Button.onclick = () => Start(Name)
	Get("Modes").appendChild(Button)
})

document.querySelectorAll("[data-K]").forEach(Button => {
	Button.onclick = () => {
		let Delta = +Button.dataset.d
		if (Button.dataset.k == "Size") SizeOffset = Clamp(SizeOffset + Delta, -30, 60)
		else if (Button.dataset.k == "Margin") Margin = Clamp(Margin + Delta, 0, 30)
		else Rate = Clamp(Rate + Delta, 1, 3)
		UpdateSettings()
	}
})

Get("Open").onclick = () => {
	Get("Menu").hidden = true
	Get("Settings").hidden = false
}

Get("Back").onclick = () => {
	Get("Settings").hidden = true
	Get("Menu").hidden = false
}

Canvas.addEventListener("pointerdown", E => {
	PX = E.clientX
	PY = E.clientY
	Held = true
	if (Playing) Press(PX, PY)
})

addEventListener("pointermove", E => {
	PX = E.clientX
	PY = E.clientY
})

addEventListener("pointerup", () => Held = false)
addEventListener("pointercancel", () => Held = false)
addEventListener("resize", Resize)

Resize()
UpdateSettings()
UpdateInfo()
function UpdateLevel() {
	Level = Levels[LevelIndex].Entry ? Levels[LevelIndex] : null
	Get("LevelText").textContent = "Map: " + Levels[LevelIndex].Name
}

Get("Prev").onclick = () => {
	LevelIndex = (LevelIndex + Levels.length - 1) % Levels.length
	UpdateLevel()
}

Get("Next").onclick = () => {
	LevelIndex = (LevelIndex + 1) % Levels.length
	UpdateLevel()
}

UpdateLevel()
requestAnimationFrame(Frame)
</script>
</body>
</html>
