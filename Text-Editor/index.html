<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title></title>
	<style>
		#Ghost, #Textbox { position: absolute; top: 0; left: 0; width: 100%; height: 100%; box-sizing: border-box; margin: 0; padding: 4px; border: 1px solid; font: 16px monospace; line-height: 1.4; white-space: pre-wrap; overflow-wrap: break-word; overflow-x: hidden; overflow-y: scroll; }
		#Ghost { border-color: transparent; pointer-events: none; scrollbar-color: transparent transparent; }
		#Textbox { background: transparent; resize: none; }
	</style>
</head>
<body style="display:flex;flex-direction:column;height:100vh;margin:0">
	<div>
		<span id="FileBar"></span>
		<button id="NewFile">+</button>
	</div>
	<div style="flex:1;min-height:0;position:relative">
		<div id="Ghost"></div>
		<textarea id="Textbox"></textarea>
	</div>
	<script>
		// Elements
		let FileBar = document.getElementById("FileBar");
		let Textbox = document.getElementById("Textbox");
		let Ghost = document.getElementById("Ghost");
		// Files
		let Files = [{ Name: "File 1", Text: "" }];
		let Current = 0;
		// Prediction
		let Suggestion = "";

		let RenderFiles = function () {
			FileBar.innerHTML = "";
			Files.forEach(function (File, Index) {
				let Button = document.createElement("button");
				Button.textContent = Index == Current ? "[" + File.Name + "]" : File.Name;
				Button.onclick = function () {
					Current = Index;
					Textbox.value = File.Text;
					RenderFiles();
					Predict();
				};
				FileBar.appendChild(Button);
			});
		};

		let Predict = function () {
			let Partial = (Textbox.value.slice(0, Textbox.selectionStart).match(/[A-Za-z']+$/) || [""])[0].toLowerCase();
			let Counts = {};
			let Matches;
			let Hidden = document.createElement("span");
			let Faded = document.createElement("span");
			Files.forEach(function (File) {
				(File.Text.toLowerCase().match(/[a-z']+/g) || []).forEach(function (Word) {
					Counts[Word] = (Counts[Word] || 0) + 1;
				});
			});
			Matches = Partial && Textbox.selectionStart == Textbox.selectionEnd && ["", "\n"].includes(Textbox.value.charAt(Textbox.selectionStart)) ? Object.keys(Counts).filter(function (Word) {
				return Word.length > Partial.length && Word.startsWith(Partial);
			}).sort(function (A, B) {
				return Counts[B] - Counts[A];
			}) : [];
			Suggestion = Matches.length ? Matches[0].slice(Partial.length) : "";
			Hidden.style.visibility = "hidden";
			Hidden.textContent = Textbox.value.slice(0, Textbox.selectionStart);
			Faded.style.opacity = "0.4";
			Faded.textContent = Suggestion;
			Ghost.innerHTML = "";
			Ghost.append(Hidden, Faded);
			Ghost.scrollTop = Textbox.scrollTop;
		};

		let Update = function () {
			Files[Current].Text = Textbox.value;
			Predict();
		};

		Textbox.oninput = Update;
		Textbox.onkeyup = Predict;
		Textbox.onclick = Predict;
		Textbox.onscroll = function () {
			Ghost.scrollTop = Textbox.scrollTop;
		};
		Textbox.onkeydown = function (Event) {
			if (Event.key == "Tab" && Suggestion) {
				Event.preventDefault();
				Textbox.setRangeText(Suggestion, Textbox.selectionStart, Textbox.selectionStart, "end");
				Update();
			}
		};

		document.getElementById("NewFile").onclick = function () {
			Files.push({ Name: "File " + (Files.length + 1), Text: "" });
			Current = Files.length - 1;
			Textbox.value = "";
			RenderFiles();
			Predict();
		};

		document.ondragover = function (Event) {
			Event.preventDefault();
		};
		document.ondrop = async function (Event) {
			Event.preventDefault();
			for (let Dropped of Event.dataTransfer.files) {
				Files.push({ Name: Dropped.name, Text: await Dropped.text() });
			}
			Current = Files.length - 1;
			Textbox.value = Files[Current].Text;
			RenderFiles();
			Predict();
		};

		RenderFiles();
	</script>
</body>
</html>
