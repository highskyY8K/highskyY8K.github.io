<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joining...</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 15vh; }
  </style>
</head>
<body>
  <h1 id="title">Joining server...</h1>
  <p id="msg"></p>

  <script>
    const params = new URLSearchParams(location.search);
    const place = params.get("place");
    let job = params.get("job");

    if (!job) {
      for (const key of params.keys()) {
        if (/^[0-9a-fA-F-]{36}$/.test(key)) { job = key; break; }
      }
    }

    const title = document.getElementById("title");
    const msg = document.getElementById("msg");

    const valid = /^\d+$/.test(place || "") && /^[0-9a-fA-F-]{36}$/.test(job || "");

    const closeTab = () => {
      window.open("", "_self", "");
      window.close();
      self.close();
      setTimeout(() => {
        title.textContent = "Launched, you can close this tab";
      }, 400);
    };

    if (!valid) {
      title.textContent = "Invalid link";
      msg.textContent = "Use ?place=PLACEID&job=JOBID";
    } else {
      const appLink = `roblox://experiences/start?placeId=${place}&gameInstanceId=${job}`;
      const webLink = `https://www.roblox.com/games/start?placeId=${place}&gameInstanceId=${job}`;

      let launched = false;

      const onLaunched = () => {
        if (launched) return;
        launched = true;
        title.textContent = "Launched";
        setTimeout(closeTab, 1500);
      };

      window.addEventListener("blur", onLaunched);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) onLaunched();
      });

      window.location.replace(appLink);

      setTimeout(() => {
        if (!launched) window.location.replace(webLink);
      }, 2000);
    }
  </script>
</body>
</html>
