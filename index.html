<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Highsky's shortcuts</title>
</head>
<body>
	<script>
		let CreateButton = function (Path) {
			let Button = document.createElement("button");
			Button.textContent = Path.split("/")[1];
			Button.onclick = function () {
				window.location.href = Path;
			};
			document.body.appendChild(Button);
		};
		let Webpages = [
			"./Text-Editor/index.html",
		];
		Webpages.forEach(CreateButton);
	</script>
</body>
</html>
